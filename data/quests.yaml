# Aufträge (ARCHITECTURE.md, "Quests"). Angenommen und abgegeben beim Auftraggeber (giver_id = Händler).
# objective: deliver (Gegenstände abgeben, sie werden genommen) oder kill (Monster besiegen,
# zählt für jedes Mitglied der Partei im Raum; seltene Varianten zählen für ihre Grundform).

# --- Oakhaven und Umgebung (Stufe 1–5) ---


# --- Einstieg für Neulinge (Hauptmann Rowan, Marktplatz): erklärt Wege, Kampf, Rasten, Beute ---

- id: intro_first_steps
  name: "Willkommen in Oakhaven"
  giver_id: captain
  description: "Erst einmal: Lern die Stadt kennen. Unter „Ausgänge“ gehst du in eine Richtung, die Karte zeigt dir die Umgebung. Im Osten steht Alchemistin Elira am Kaufmannsstand – Tränke, Brot, und sie kauft dir deine Beute ab. Im Westen schmiedet Brandt Waffen und Rüstungen. Schau dir beide an und komm zurück."
  completion_text: "Gut. Nimm diesen Dolch – im Inventar auf „Anlegen“ drücken, dann triffst du härter. Was ein Gegenstand bringt, steht unter seinem Namen; ein Klick auf den Namen erzählt dir mehr."
  steps:
    - {type: visit, room_id: town_market}
    - {type: visit, room_id: town_smithy}
  reward: {xp: 20, gold: 10, items: [{item_id: rusty_dagger}]}

- id: intro_rats
  name: "Ratten am Feldweg"
  giver_id: captain
  description: "Hinter dem Kaufmannsstand, Richtung Osten, liegt der Feldweg. Die Ratten dort sind lästig, aber harmlos. Besieg zwei: Bei einem Gegner auf „Angreifen“, dann schlägst du jede Runde zu und er zurück. Wird es eng, flieh. Und merk dir: Deine Wunden heilen da draußen nicht von selbst."
  completion_text: "Du blutest ja. Hier auf dem Marktplatz und an jedem anderen sicheren Ort kannst du rasten – das heilt dich vollständig, kostenlos. Draußen helfen nur Tränke und Essen. Nimm zwei Heiltränke für den Notfall."
  steps:
    - {type: kill, monster_id: field_rat, count: 2}
  reward: {xp: 40, gold: 10, items: [{item_id: healing_potion, quantity: 2}]}
  requires: [intro_first_steps]

- id: intro_loot
  name: "Beute zu Gold"
  giver_id: captain
  description: "Was Monster fallen lassen, landet in deinem Rucksack. Die Bauern zahlen Kopfgeld für Rattenschwänze – bring mir drei. Was du sonst findest und nicht trägst, verkauf bei Elira."
  completion_text: "Drei Schwänze, drei Ratten weniger. Mit dem Gold kaufst du bei Brandt bessere Ausrüstung – Rüstung zählt da draußen bald mehr als Mut. Die Kappe hier ist ein Anfang."
  steps:
    - {type: deliver, item_id: rat_tail, quantity: 3}
  reward: {xp: 50, gold: 15, items: [{item_id: leather_cap}]}
  requires: [intro_rats]

- id: intro_into_the_world
  name: "Hinaus in die Welt"
  giver_id: captain
  description: "Zeit für echte Gegner. Geh durchs Südtor in den Dunklen Wald und besieg zwei Goblin-Späher. Rasten vorher schadet nicht."
  completion_text: "Du bist bereit. Die Leute hier haben Aufträge für dich – Elira, Brandt, Grete in der Mühle, Hanne im Gasthaus und Schwester Liora im Tempel. Das Panel „Aufträge“ zeigt dir, was sie wollen, und die Sterne auf der Karte, wohin es geht. Viel Glück."
  steps:
    - {type: visit, room_id: forest_gate}
    - {type: kill, monster_id: goblin, count: 2}
  reward: {xp: 80, gold: 20, items: [{item_id: wooden_shield}]}
  requires: [intro_loot]

- id: rat_plague
  name: "Rattenplage"
  giver_id: miller
  description: "Die Biester fressen mir das Korn aus den Säcken! Bring mir fünf Rattenschwänze, damit ich weiß, dass du es ernst meinst."
  completion_text: "Fünf weniger! Hier, nimm Kuchen – und komm wieder, wenn du Hunger hast."
  objective: {type: deliver, item_id: rat_tail, quantity: 5}
  reward: {xp: 40, gold: 15, items: [{item_id: apple_pie, quantity: 2}]}

- id: boar_roast
  name: "Wildbret für den Krug"
  giver_id: innkeeper
  description: "Die Gäste wollen Braten, und mein Jäger ist seit dem Leuchtturm-Gerede verschwunden. Drei Wildschweinkeulen, und du isst eine Woche umsonst – na ja, fast."
  completion_text: "Das riecht schon roh nach Feiertag. Hier, Eintopf auf Kosten des Hauses."
  objective: {type: deliver, item_id: boar_ham, quantity: 3}
  reward: {xp: 60, gold: 20, items: [{item_id: stew, quantity: 2}]}

- id: goblin_research
  name: "Ohren für die Wissenschaft"
  giver_id: alchemist
  description: "Goblinohren sind eine hervorragende Grundlage für Heiltränke. Frag nicht. Sechs Stück, bitte."
  completion_text: "Wunderbar frisch! Zwei Tränke für dich – aus genau solchen Ohren gebraut."
  objective: {type: deliver, item_id: goblin_ear, quantity: 6}
  reward: {xp: 60, gold: 25, items: [{item_id: healing_potion, quantity: 2}]}

- id: wolves_at_the_gate
  name: "Wölfe vor den Toren"
  giver_id: smith
  description: "Die Wölfe im Wald werden frech, letzte Woche haben sie den Wachposten angefallen. Erlege vier, und ich schmiede dir eine Kappe."
  completion_text: "Gute Arbeit. Die Kappe passt – ich hab Augenmaß."
  objective: {type: kill, monster_id: wolf, count: 4}
  reward: {xp: 90, gold: 30, items: [{item_id: leather_cap}]}
  min_level: 2

- id: rest_for_the_dead
  name: "Ruhe für die Toten"
  giver_id: priestess
  description: "Auf dem Alten Friedhof wandeln die Toten. Gib fünf von ihnen die Ruhe zurück, die man ihnen genommen hat."
  completion_text: "Das Licht dankt dir. Doch solange die Gruft offen ist, werden sie wieder aufstehen …"
  objective: {type: kill, monster_id: shambling_corpse, count: 5}
  reward: {xp: 150, gold: 30, items: [{item_id: holy_water, quantity: 2}]}
  min_level: 3

- id: valen_ring
  name: "Der Ring der Valen"
  giver_id: priestess
  description: "Der Grabfürst trägt den Siegelring seiner Familie. Bring ihn mir – nur geweiht kann er die Toten nicht mehr rufen."
  completion_text: "Spürst du, wie still es geworden ist? Trag dieses Amulett. Es wird dich an diesen Tag erinnern."
  objective: {type: deliver, item_id: valen_signet, quantity: 1}
  reward: {xp: 300, gold: 80, items: [{item_id: light_charm}]}
  min_level: 4
  requires: [rest_for_the_dead]

- id: golden_tooth
  name: "Ein Zahn aus Gold"
  giver_id: goldsmith
  description: "Man erzählt von einem Goblin mit goldenen Zähnen. Unsinn, sagst du? Bring mir einen, und ich mache dir einen Ring daraus."
  completion_text: "Echtes Gold, tatsächlich! Wie versprochen."
  objective: {type: deliver, item_id: gold_tooth, quantity: 1}
  reward: {gold: 20, items: [{item_id: silver_ring}]}

# --- Sturmküste (Stufe 4–7) ---

- id: shells_and_claws
  name: "Scheren und Schalen"
  giver_id: fisherwoman
  description: "Aus Krabbenpanzern machen wir Knöpfe und Schalen. Fünf Stück, und ich räuchere dir was Feines."
  completion_text: "Schöne, dicke Panzer. Hier, frisch aus dem Rauch."
  objective: {type: deliver, item_id: crab_shell, quantity: 5}
  reward: {xp: 120, gold: 25, items: [{item_id: smoked_fish, quantity: 3}]}
  min_level: 4

- id: silence_the_song
  name: "Das Lied verstummen lassen"
  giver_id: fisherwoman
  description: "Die Frau im Leuchtturm singt, und unsere Männer fahren auf die Klippen. Mach, dass sie schweigt. Für immer."
  completion_text: "Heute Nacht ist es still am Meer. Zum ersten Mal seit Jahren. Danke."
  objective: {type: kill, monster_id: sea_witch, count: 1}
  reward: {xp: 500, gold: 100, items: [{item_id: coral_amulet}]}
  min_level: 6

# --- Grauzahn-Gebirge und Tiefen (Stufe 6–10) ---

- id: winter_furs
  name: "Pelze für den Winter"
  giver_id: dwarf_armorer
  description: "Der Winter auf dem Posten ist lang. Vier Frostwolfpelze, und du bekommst Stiefel, die nicht einmal ein Golem durchtritt."
  completion_text: "Warm wie eine Esse. Hier, deine Stiefel."
  objective: {type: deliver, item_id: frost_pelt, quantity: 4}
  reward: {xp: 300, gold: 60, items: [{item_id: iron_boots}]}
  min_level: 7

- id: ice_for_the_forge
  name: "Eis für die Esse"
  giver_id: dwarf_armorer
  description: "Ewiges Eis kühlt den Stahl besser als jedes Wasser. Ich nehme alles, was du bringst – drei Splitter pro Fuhre."
  completion_text: "Gutes Eis. Bring mehr, wenn du welches findest."
  objective: {type: deliver, item_id: ice_shard, quantity: 3}
  reward: {xp: 120, gold: 50}
  min_level: 8
  repeatable: true

- id: spider_silk
  name: "Seide aus der Tiefe"
  giver_id: alchemist
  description: "Spinnenseide hält Verbände, die nicht reißen. Sechs Stränge aus der Spinnengrotte, und ich gebe dir mein bestes Elixier."
  completion_text: "Wie zäh sie ist! Das Elixier hast du dir verdient."
  objective: {type: deliver, item_id: spider_silk, quantity: 6}
  reward: {xp: 280, gold: 50, items: [{item_id: elixir}]}
  min_level: 7

- id: heal_the_grove
  name: "Den Hain heilen"
  giver_id: elf_ranger
  description: "Die Dryaden waren meine Schwestern. Jetzt sind ihre Augen schwarz. Erlöse vier von ihnen."
  completion_text: "Sie sind frei. Doch der Hüter trinkt noch immer vom Schatten …"
  objective: {type: kill, monster_id: dryad, count: 4}
  reward: {xp: 700, gold: 80, items: [{item_id: leaf_ring}]}
  min_level: 9

- id: return_the_heart
  name: "Das Herz der Erde"
  giver_id: elf_ranger
  description: "Wer den Hüter erlöst, gebe sein Herz der Erde zurück – so steht es auf den Grenzsteinen. Bring mir sein Herzholz."
  completion_text: "Ich pflanze es unter den Uralten Baum. Vielleicht wächst etwas Neues daraus. Trag meinen Mantel, Freund."
  objective: {type: deliver, item_id: warden_heartwood, quantity: 1}
  reward: {xp: 1500, gold: 200, items: [{item_id: elven_cloak}]}
  min_level: 10
  requires: [heal_the_grove]

# --- Feuerschlund, Aelmar, Schattenreich (Stufe 11–15) ---

- id: ember_cores
  name: "Glutkerne"
  giver_id: crater_scout
  description: "Die Zwerge zahlen ein Vermögen für Glutkerne, und ich bin zu klug, um selbst gegen Golems zu kämpfen. Drei Stück?"
  completion_text: "Ha! Die Zwerge werden staunen. Nimm die Tränke, du siehst aus, als bräuchtest du sie."
  objective: {type: deliver, item_id: ember_core, quantity: 3}
  reward: {xp: 900, gold: 120, items: [{item_id: phoenix_draught, quantity: 2}]}
  min_level: 12

- id: crests_of_aelmar
  name: "Die Wappen von Aelmar"
  giver_id: old_diver
  description: "Die Ritter dort unten waren meine Vorfahren. Bring mir vier ihrer Wappen, damit ich sie oben begraben kann."
  completion_text: "Blubb … Verzeihung. Danke. Wirklich."
  objective: {type: deliver, item_id: knight_crest, quantity: 4}
  reward: {xp: 1000, gold: 150, items: [{item_id: kelp_salve, quantity: 3}]}
  min_level: 12

- id: shards_of_void
  name: "Splitter der Leere"
  giver_id: faceless_merchant
  description: "Leerensplitter. Fünf. Frag nicht, wofür."
  completion_text: "Gut. Komm wieder, wenn du mehr hast."
  objective: {type: deliver, item_id: void_shard, quantity: 5}
  reward: {xp: 600, gold: 200, items: [{item_id: starlight_tonic}]}
  min_level: 14
  repeatable: true

- id: the_last_king
  name: "Der letzte König"
  giver_id: priestess
  description: "Unter der Mine sitzt ein König, der älter ist als die Sterne. Alles, was uns plagt, kommt von ihm. Ich bitte dich nicht. Ich bete für dich."
  completion_text: "Die Kerzen brennen heller als je zuvor. Was immer du dort unten getan hast – das Licht wird es nicht vergessen."
  objective: {type: kill, monster_id: morvath, count: 1}
  reward: {xp: 3000, gold: 500, items: [{item_id: phoenix_draught, quantity: 3}]}
  min_level: 15
  requires: [valen_ring]

# --- Zweites Auftragspaket: Lücken zwischen den Gebieten und Bossjagden ---

- id: crow_scare
  name: "Vogelscheuche ohne Wirkung"
  giver_id: miller
  description: "Meine Vogelscheuche lacht mich aus, und die Krähen lachen mit. Bring mir vier Krähenfedern, dann hänge ich sie als Warnung auf."
  completion_text: "Mal sehen, wer jetzt lacht. Hier, ein Stück Käse für jede zweite Feder."
  objective: {type: deliver, item_id: crow_feather, quantity: 4}
  reward: {xp: 50, gold: 12, items: [{item_id: cheese, quantity: 2}]}

- id: swamp_remedy
  name: "Kräuter aus dem Moor"
  giver_id: alchemist
  description: "Moorkraut verdirbt schnell, deshalb habe ich nie genug davon. Sechs Bündel, frisch, und ich zeige dir, was ein richtiger Trank ist."
  completion_text: "Noch feucht, perfekt. Das hier ist ein großer Heiltrank – teil ihn dir gut ein."
  objective: {type: deliver, item_id: bog_herb, quantity: 6}
  reward: {xp: 80, gold: 20, items: [{item_id: greater_potion}]}
  min_level: 3

- id: sacred_ash
  name: "Asche zu Asche"
  giver_id: priestess
  description: "Den Staub der Gefallenen zu segnen, gibt ihnen Frieden, den der Riss ihnen genommen hat. Bring mir fünf Häufchen Knochenstaub."
  completion_text: "Ich werde für sie beten. Nimm das geweihte Wasser – es schützt die Lebenden genauso."
  objective: {type: deliver, item_id: bone_dust, quantity: 5}
  reward: {xp: 120, gold: 25, items: [{item_id: holy_water, quantity: 2}]}
  min_level: 3
  requires: [rest_for_the_dead]

- id: troll_toll
  name: "Brückenzoll"
  giver_id: smith
  description: "Ein Höhlentroll hält die Pässe besetzt und frisst meine Erzlieferungen gleich mit. Sorge dafür, dass er nichts mehr frisst."
  completion_text: "Endlich kommt wieder Eisen. Der Schild ist aus der ersten Lieferung – du hast ihn dir verdient."
  objective: {type: kill, monster_id: cave_troll, count: 1}
  reward: {xp: 350, gold: 60, items: [{item_id: iron_shield}]}
  min_level: 5
  requires: [wolves_at_the_gate]

- id: smugglers_cove
  name: "Fremde Boote"
  giver_id: fisherwoman
  description: "Nachts legen Boote ohne Laternen an, und am Morgen fehlen unsere Netze. Vier Schmuggler weniger, und die Bucht gehört wieder uns."
  completion_text: "Heute Nacht schlafe ich zum ersten Mal durch. Hier, das Beste aus meiner Räucherkammer."
  objective: {type: kill, monster_id: smuggler, count: 4}
  reward: {xp: 350, gold: 60, items: [{item_id: smoked_fish, quantity: 4}]}
  min_level: 6

- id: harpy_quills
  name: "Federn für Pfeile"
  giver_id: dwarf_armorer
  description: "Harpyienfedern fliegen gerader als alles, was ein Zwerg rupfen kann. Vier Stück, und ich gebe dir einen Helm, der etwas aushält."
  completion_text: "Gute Kiele. Der Helm ist zwergisch geschmiedet – nicht hübsch, aber dein Kopf bleibt dran."
  objective: {type: deliver, item_id: harpy_feather, quantity: 4}
  reward: {xp: 220, gold: 40, items: [{item_id: iron_helm}]}
  min_level: 6

- id: clear_the_mine
  name: "Die Mine zurückerobern"
  giver_id: dwarf_armorer
  description: "Die Grubenghule hausen in unseren alten Stollen. Mein Großvater liegt dort unten. Erschlag fünf von ihnen."
  completion_text: "Fünf. Er hätte gelacht und ‚nur fünf?‘ gesagt. Nimm die Beinschienen, er hätte es so gewollt."
  objective: {type: kill, monster_id: mine_ghoul, count: 5}
  reward: {xp: 300, gold: 50, items: [{item_id: iron_greaves}]}
  min_level: 6

- id: bottled_storm
  name: "Der Sturm in der Flasche"
  giver_id: fisherwoman
  description: "Die alten Fischer sagen, wer Sturmessenz am Bug trägt, kentert nie. Ich glaube es nicht – aber meine Leute schon. Drei Stück."
  completion_text: "Sie werden sich sicherer fühlen, und das ist auf See schon die halbe Miete. Hier, mein alter Ölmantel."
  objective: {type: deliver, item_id: storm_essence, quantity: 3}
  reward: {xp: 300, gold: 50, items: [{item_id: oilskin_coat}]}
  min_level: 7

- id: lights_in_the_mist
  name: "Lichter im Nebel"
  giver_id: elf_ranger
  description: "Die Irrlichter waren einst Seelen unseres Volkes, die den Weg nach Hause suchten. Fange vier ihrer Lichter, damit wir sie zur Ruhe betten."
  completion_text: "Sie leuchten jetzt ruhiger. Danke, Fremde. Nimm unser Brot für den Weg."
  objective: {type: deliver, item_id: wisp_light, quantity: 4}
  reward: {xp: 400, gold: 60, items: [{item_id: elven_bread, quantity: 3}]}
  min_level: 8

- id: queen_of_webs
  name: "Die Königin der Netze"
  giver_id: alchemist
  description: "Deine Seide hat mir gezeigt, woher die Spinnen kommen: aus einem Nest, das Ysvara bewacht. Solange sie lebt, kommen mehr. Töte die Königin."
  completion_text: "Kein Nest mehr, keine Brut mehr. Zwei Elixiere, mein bestes Werk."
  objective: {type: kill, monster_id: spider_queen, count: 1}
  reward: {xp: 900, gold: 150, items: [{item_id: elixir, quantity: 2}]}
  min_level: 9
  requires: [spider_silk]

- id: thorns_of_the_grove
  name: "Dornen im Hain"
  giver_id: elf_ranger
  description: "Wo die Dryaden fielen, wachsen jetzt Dornenbestien aus dem kranken Boden. Drei müssen fallen, bevor der Hain wieder atmen kann."
  completion_text: "Ich höre die Vögel wieder. Nimm diese Silberblätter – sie wachsen nur, wo der Boden heilt."
  objective: {type: kill, monster_id: thorn_beast, count: 3}
  reward: {xp: 1000, gold: 120, items: [{item_id: silverleaf, quantity: 5}]}
  min_level: 10
  requires: [heal_the_grove]

- id: hrimfang
  name: "Hrimfangs Ende"
  giver_id: dwarf_armorer
  description: "Der Eisdrache hat sich in unserer Esse eingenistet, als die Kälte kam. Die Pelze haben uns durch den Winter gebracht – jetzt bring uns die Esse zurück."
  completion_text: "Das Feuer brennt wieder! Hier, Gold aus der Kriegskasse und Elixiere aus der Feldapotheke."
  objective: {type: kill, monster_id: ice_drake, count: 1}
  reward: {xp: 1500, gold: 250, items: [{item_id: elixir, quantity: 3}]}
  min_level: 10
  requires: [winter_furs]

- id: salamander_hunt
  name: "Schuppen aus der Glut"
  giver_id: crater_scout
  description: "Salamanderschuppen halten Hitze ab – mit genug davon könnten wir näher an den Krater heran. Vier Stück."
  completion_text: "Die nähe ich mir in die Stiefel. Nimm die Feuerblüten, sie wachsen hier wie Unkraut."
  objective: {type: deliver, item_id: salamander_scale, quantity: 4}
  reward: {xp: 700, gold: 90, items: [{item_id: fire_blossom, quantity: 4}]}
  min_level: 11

- id: ash_wraiths
  name: "Asche im Wind"
  giver_id: crater_scout
  description: "Die Aschegeister sind die Kundschafter, die vor mir hier waren. Gib ihnen das Ende, das ich mir für mich selbst wünschen würde. Fünf."
  completion_text: "Danke. Ich hoffe, wenn es mich trifft, kommt jemand wie du."
  objective: {type: kill, monster_id: ash_wraith, count: 5}
  reward: {xp: 800, gold: 100, items: [{item_id: phoenix_draught}]}
  min_level: 11

- id: deep_raiders
  name: "Räuber der Tiefe"
  giver_id: old_diver
  description: "Die Tiefseeräuber plündern die Gräber von Aelmar, bevor ich sie erforschen kann. Fünf weniger, und ich tauche wieder ruhiger."
  completion_text: "Gut. Die Salbe hier hält die Kälte des Wassers aus den Knochen."
  objective: {type: kill, monster_id: deep_raider, count: 5}
  reward: {xp: 800, gold: 100, items: [{item_id: kelp_salve, quantity: 2}]}
  min_level: 11

- id: giants_teeth
  name: "Zähne eines Riesen"
  giver_id: goldsmith
  description: "Feuerriesenzähne sind härter als jeder Edelstein. Ich will einen Ring daraus fassen, den es noch nie gab. Drei Zähne."
  completion_text: "Was für ein Material! Hier – ein Rubinring aus meinem Fenster, solange ich an dem neuen arbeite."
  objective: {type: deliver, item_id: giant_tooth, quantity: 3}
  reward: {xp: 1000, gold: 150, items: [{item_id: ruby_ring}]}
  min_level: 13

- id: the_ember_lord
  name: "Der Glutfürst"
  giver_id: crater_scout
  description: "Die Glutkerne kommen aus dem Herzen des Kraters, und dort sitzt Ignaros. Er ist es, der den Berg brennen lässt. Lösch ihn."
  completion_text: "Der Berg ist still. Zum ersten Mal, seit ich hier bin. Nimm meine letzten Tränke – ich brauche sie nicht mehr."
  objective: {type: kill, monster_id: ignaros, count: 1}
  reward: {xp: 2200, gold: 350, items: [{item_id: phoenix_draught, quantity: 2}]}
  min_level: 13
  requires: [ember_cores]

- id: the_eye_of_the_deep
  name: "Das Auge der Tiefe"
  giver_id: old_diver
  description: "Die Wappen sagen es klar: Aelmar ist nicht gesunken, es wurde hinabgezogen. Ul'thar lebt noch in der Thronhalle. Bring die Stadt zur Ruhe."
  completion_text: "Ich habe dreißig Jahre auf diesen Tag gewartet. Nimm meinen alten Helm – ich tauche nicht mehr."
  objective: {type: kill, monster_id: kraken, count: 1}
  reward: {xp: 2500, gold: 400, items: [{item_id: diver_helm}]}
  min_level: 13
  requires: [crests_of_aelmar]

- id: pelts_of_shadow
  name: "Pelze aus Schatten"
  giver_id: faceless_merchant
  description: "Schattenpelze. Vier. Frag nicht, wofür. Ich frage auch nicht, wie du sie bekommst."
  completion_text: "Sehr gut. Du bist nützlicher, als du aussiehst. Hier – Sternenlicht, eingefangen und abgefüllt."
  objective: {type: deliver, item_id: shadow_pelt, quantity: 4}
  reward: {xp: 1200, gold: 200, items: [{item_id: starlight_tonic}]}
  min_level: 14

- id: sleepless_nights
  name: "Schlaflose Nächte"
  giver_id: innkeeper
  description: "Seit der Riss tiefer wird, wachen meine Gäste schreiend auf. Ein Wanderprediger sagt, die Albträume kommen von dort unten – als Wesen. Drei davon, bitte."
  completion_text: "Letzte Nacht war es still im ganzen Haus. Das Zimmer gehört dir, wann immer du willst – und die Mondlilien hier auch."
  objective: {type: kill, monster_id: nightmare, count: 3}
  reward: {xp: 2000, gold: 300, items: [{item_id: moon_lily, quantity: 4}]}
  min_level: 15

# --- Questketten mit Geschichte ---

# Kette: Der verschwundene Jäger (Wirtin Hanne, Fischerin Maren)

- id: hunter_trail
  name: "Der verschwundene Jäger"
  giver_id: innkeeper
  description: "Tamm, mein Jäger, ist zur Küste gegangen, um sich das Lied vom Leuchtturm anzuhören. Er kam nie zurück. Die Ertrunkenen dort tragen Sachen von Leuten, die das Meer geholt hat – bring mir, was du findest. Er hatte einen alten Kompass."
  completion_text: "Das ist seiner. Die Kerbe am Rand hat er selbst gemacht … Er lebt vielleicht noch. Frag Maren im Fischerdorf."
  objective: {type: deliver, item_id: old_compass, quantity: 1}
  reward: {xp: 200, gold: 30, items: [{item_id: stew, quantity: 2}]}
  min_level: 4
  requires: [boar_roast]

- id: hunter_drowned
  name: "Unter den Ertrunkenen"
  giver_id: fisherwoman
  description: "Hanne schickt dich wegen Tamm? Seit das Lied begann, steigen die Ertrunkenen aus dem Wasser. Wenn er unter ihnen ist, gib ihm Ruhe. Wenn nicht, wissen wir mehr."
  completion_text: "Er war nicht dabei. Aber einer hatte ein Ruder mit dem Zeichen der Schmuggler. Das gefällt mir gar nicht."
  objective: {type: kill, monster_id: drowned_sailor, count: 4}
  reward: {xp: 250, gold: 40, items: [{item_id: smoked_fish, quantity: 3}]}
  min_level: 5
  requires: [hunter_trail]

- id: hunter_smugglers
  name: "Ware ohne Zoll"
  giver_id: fisherwoman
  description: "Die Schmuggler verschleppen Leute, die nachts am Strand sind, und lassen sie rudern. Bring mir vier Kisten ihrer Ware – damit gehe ich zum Hafenmeister, und er muss mir glauben."
  completion_text: "Das reicht. Und in einer Kiste lag Tamms Jagdmesser. Er rudert für sie, ganz sicher."
  objective: {type: deliver, item_id: contraband, quantity: 4}
  reward: {xp: 350, gold: 60, items: [{item_id: greater_potion, quantity: 2}]}
  min_level: 6
  requires: [hunter_drowned]

- id: hunter_home
  name: "Heimkehr"
  giver_id: innkeeper
  description: "Maren hat mir alles geschrieben. Tamm sitzt an einem Ruder in ihrer Bucht. Bitte – schlag die Schmuggler in die Flucht, sechs von ihnen, dann lassen sie ihre Ruderer laufen."
  completion_text: "Er sitzt da drüben am Feuer und schweigt, aber er ist zu Hause. Er will, dass du seine Harpune bekommst. Er sagt, er jagt nie wieder am Wasser."
  objective: {type: kill, monster_id: smuggler, count: 6}
  reward: {xp: 600, gold: 100, items: [{item_id: harpoon}]}
  min_level: 7
  requires: [hunter_smugglers]

# Kette: Die Halle von Khazdur (Waffenmeisterin Brunhild)

- id: khazdur_depths
  name: "Wie tief sie graben"
  giver_id: dwarf_armorer
  description: "Die Ghule tragen Erzstaub an den Krallen, den es nur ganz unten gibt – in der alten Halle von Khazdur. Sechs Krallen, und ich weiß, wie tief sie schon gegraben haben."
  completion_text: "Tiefenerz. Sie sind bis zur Halle durch. Dann ist es Zeit, sie zurückzuholen."
  objective: {type: deliver, item_id: ghoul_claw, quantity: 6}
  reward: {xp: 300, gold: 50, items: [{item_id: greater_potion}]}
  min_level: 6
  requires: [clear_the_mine]

- id: khazdur_guardians
  name: "Gefallene Wächter"
  giver_id: dwarf_armorer
  description: "Die Eisgolems haben einmal die Tore von Khazdur bewacht. Der Riss hat ihre Runen erfroren, jetzt greifen sie jeden an. Zerschlag drei – ehrenvoll, bitte, es waren gute Golems."
  completion_text: "In ihren Kernen leuchten noch die alten Runen. Wir werden sie neu schreiben."
  objective: {type: kill, monster_id: ice_golem, count: 3}
  reward: {xp: 450, gold: 70, items: [{item_id: elixir}]}
  min_level: 8
  requires: [khazdur_depths]

- id: khazdur_webs
  name: "Netze vor dem Tor"
  giver_id: dwarf_armorer
  description: "Hinter den Golems kommen die Spinnen. Ihre Netze hängen vor dem Tor zur Halle, dicht wie ein Vorhang. Sechs Spinnen, dann kommen wir durch."
  completion_text: "Das Tor ist frei. Ich habe es gesehen, zum ersten Mal mit eigenen Augen. Es ist kleiner, als die Lieder sagen."
  objective: {type: kill, monster_id: cave_spider, count: 6}
  reward: {xp: 450, gold: 70, items: [{item_id: greater_potion, quantity: 2}]}
  min_level: 8
  requires: [khazdur_guardians]

- id: khazdur_hall
  name: "Die Halle von Khazdur"
  giver_id: dwarf_armorer
  description: "In der Halle sitzt Ysvara, die Spinnenkönigin, auf dem Thron meines Volkes. Bring mir ihren Giftzahn. Aus dem Gift schmieden wir den Eid, mit dem wir die Halle wieder in Besitz nehmen."
  completion_text: "Khazdur gehört wieder uns. Nimm den Panzer meines Großvaters – er hätte gewollt, dass ihn jemand trägt, der durch dieses Tor gegangen ist."
  objective: {type: deliver, item_id: queen_fang, quantity: 1}
  reward: {xp: 900, gold: 150, items: [{item_id: dwarven_plate}]}
  min_level: 9
  requires: [khazdur_webs]

# Kette: Die Laternen der Tiefe (Ilva, Brack, der Händler ohne Gesicht, Schwester Liora)

- id: lanterns_ash
  name: "Die Asche der Kundschafter"
  giver_id: crater_scout
  description: "Die Laternenpriester in der letzten Zuflucht sammeln die Asche der Gefallenen für ihre Lampen. Sie sagen, sie leuchtet gegen die Schatten. Fünf Häufchen Geisterasche – für meine Kameraden."
  completion_text: "Ich schicke sie hinunter. Wenn ihre Asche dort unten leuchtet, waren sie nicht umsonst hier."
  objective: {type: deliver, item_id: wraith_ash, quantity: 5}
  reward: {xp: 700, gold: 90, items: [{item_id: fire_blossom, quantity: 3}]}
  min_level: 11
  requires: [ash_wraiths]

- id: lanterns_knights
  name: "Laternen unter Wasser"
  giver_id: old_diver
  description: "Ilva hat mir von den Laternen erzählt. Die Ritter von Aelmar trugen genau solche, als die Stadt sank – sie haben gegen etwas gekämpft, das aus dem Riss kam. Vier ertrunkene Ritter, und ich hole ihre Laternen herauf."
  completion_text: "Sie brennen noch. Unter Wasser, nach all der Zeit. Das ist kein Zufall – der Riss war schon damals offen."
  objective: {type: kill, monster_id: drowned_knight, count: 4}
  reward: {xp: 900, gold: 120, items: [{item_id: kelp_salve, quantity: 2}]}
  min_level: 12
  requires: [lanterns_ash]

- id: lanterns_shadow
  name: "Was die Laternen fürchten"
  giver_id: faceless_merchant
  description: "Du bringst Laternen aus Aelmar. Interessant. Sie halten die Pirscher fern, aber nicht lange. Erlege fünf Schattenpirscher, dann zeige ich dir, wozu die Laternen wirklich dienen."
  completion_text: "Gut. Die Laternen sind Schlösser, keine Lampen. Wer genug von ihnen hat, kann eine Tür schließen. Geh zur Priesterin in Oakhaven – sie weiß, welche Tür."
  objective: {type: kill, monster_id: shadow_stalker, count: 5}
  reward: {xp: 1300, gold: 200, items: [{item_id: starlight_tonic}]}
  min_level: 14
  requires: [lanterns_knights]

- id: lanterns_seal
  name: "Das letzte Siegel"
  giver_id: priestess
  description: "Laternen als Schlösser … so steht es auch in den ältesten Gebeten. Was fehlt, sind die Siegel der Schattenwächter. Bring mir drei, und wir verschließen den Riss, so weit es Sterblichen möglich ist."
  completion_text: "Es ist getan. Der Riss ist nicht fort, aber er schläft. Nimm diesen Mondstein – er hat in der Lampe über dem Altar gelegen, seit es den Tempel gibt."
  objective: {type: deliver, item_id: warden_sigil, quantity: 3}
  reward: {xp: 2500, gold: 400, items: [{item_id: moonstone_amulet}]}
  min_level: 15
  requires: [lanterns_shadow]

# --- Mehrstufige Aufträge: Wege gehen, dann kämpfen oder bringen ---

- id: letter_to_the_mill
  name: "Ein Brief für Grete"
  giver_id: innkeeper
  description: "Bring Grete in der Mühle diesen Brief – und wenn du schon da bist: Sie hat Ärger mit Ratten. Hilf ihr mit drei davon, dann komm zurück und erzähl."
  completion_text: "Sie hat geantwortet? Und die Ratten sind weniger? Dann hast du dir den Kuchen verdient."
  steps:
    - {type: visit, room_id: mill}
    - {type: kill, monster_id: field_rat, count: 3}
  reward: {xp: 45, gold: 10, items: [{item_id: apple_pie}]}

- id: watch_the_road
  name: "Wache am Südtor"
  giver_id: smith
  description: "Die Torwache meldet Goblins im Wald. Geh zum Südtor, sieh dich um, erschlag drei der Späher und bring mir ihre Ohren – die Wache will Beweise."
  completion_text: "Drei Ohren, drei Späher weniger. Die Wache gibt einen aus, sagt sie."
  steps:
    - {type: visit, room_id: forest_gate}
    - {type: kill, monster_id: goblin, count: 3}
    - {type: deliver, item_id: goblin_ear, quantity: 3}
  reward: {xp: 70, gold: 20, items: [{item_id: wooden_shield}]}
  min_level: 2

- id: cemetery_vigil
  name: "Nachtwache"
  giver_id: priestess
  description: "Geh auf den alten Friedhof und halte Wache. Gib drei Toten Ruhe und sieh dann nach, ob die Gruft der Valen noch versiegelt ist."
  completion_text: "Das Siegel ist gebrochen? Dann hat es begonnen, wie ich befürchtet habe. Danke, dass du nachgesehen hast."
  steps:
    - {type: visit, room_id: old_cemetery}
    - {type: kill, monster_id: shambling_corpse, count: 3}
    - {type: visit, room_id: valen_crypt}
  reward: {xp: 160, gold: 30, items: [{item_id: holy_water}]}
  min_level: 3

- id: fire_in_the_bog
  name: "Das Feuer im Moor"
  giver_id: alchemist
  description: "Im Moor brennt ein Lagerfeuer, das nie ausgeht, sagen die Leute. Geh hin, sieh es dir an, und auf dem Rückweg: drei Moorschleicher und vier Bündel Moorkraut für mich."
  completion_text: "Ein Feuer, das nicht ausgeht … das muss ich mir selbst ansehen. Danke für das Kraut."
  steps:
    - {type: visit, room_id: bog_camp}
    - {type: kill, monster_id: bog_lurker, count: 3}
    - {type: deliver, item_id: bog_herb, quantity: 4}
  reward: {xp: 140, gold: 30, items: [{item_id: greater_potion}]}
  min_level: 3

- id: climb_the_lighthouse
  name: "Hinauf zum Licht"
  giver_id: fisherwoman
  description: "Seit die Hexe fort ist, brennt oben kein Licht mehr. Steig die Treppe hinauf, vertreib drei Sturmgeister und sieh nach, ob die Laterne noch ganz ist."
  completion_text: "Die Laterne ist ganz? Dann zünden wir sie heute Nacht wieder an. Die Boote werden es dir danken."
  steps:
    - {type: visit, room_id: lighthouse_stairs}
    - {type: kill, monster_id: storm_spirit, count: 3}
    - {type: visit, room_id: lighthouse_top}
  reward: {xp: 400, gold: 60, items: [{item_id: smoked_fish, quantity: 3}]}
  min_level: 7
  requires: [silence_the_song]

- id: border_patrol
  name: "Grenzgang"
  giver_id: elf_ranger
  description: "Geh die alte Grenze ab: von den Grenzsteinen zum Silberhain. Dort fang drei Irrlichter und bring mir fünf Silberblätter – sie zeigen mir, ob der Hain noch atmet."
  completion_text: "Die Blätter sind noch silbern. Er atmet. Danke, dass du den Weg gegangen bist, den wir nicht mehr gehen können."
  steps:
    - {type: visit, room_id: border_stones}
    - {type: visit, room_id: silver_grove}
    - {type: kill, monster_id: will_o_wisp, count: 3}
    - {type: deliver, item_id: silverleaf, quantity: 5}
  reward: {xp: 500, gold: 70, items: [{item_id: elven_bread, quantity: 2}]}
  min_level: 8

- id: crater_survey
  name: "Vermessung des Kraters"
  giver_id: crater_scout
  description: "Meine Karte endet am Lavastrom. Geh weiter: die Basaltstiege hinab, über den Lavastrom bis zur Schmiede der Riesen – und schlag dort zwei von ihnen nieder, damit ich in Ruhe nachkommen kann."
  completion_text: "Jetzt ist die Karte vollständig, bis auf das Herz des Vulkans. Das zeichne ich, wenn Ignaros fort ist."
  steps:
    - {type: visit, room_id: basalt_stairs}
    - {type: visit, room_id: lava_flow}
    - {type: visit, room_id: giant_forge}
    - {type: kill, monster_id: fire_giant, count: 2}
  reward: {xp: 1100, gold: 140, items: [{item_id: phoenix_draught}]}
  min_level: 12

- id: map_of_aelmar
  name: "Karte von Aelmar"
  giver_id: old_diver
  description: "Ich kenne Aelmar nur bis zum Platz. Schwimm weiter: durch die Halle der Ritter bis zum Korallenpalast, und bring zwei Wächter zum Schweigen, damit ich die Wände abzeichnen kann."
  completion_text: "Der Palast steht noch, nach all den Jahren. Ich zeichne ihn heute Nacht – nimm meine Salbe, das Wasser dort unten ist kalt."
  steps:
    - {type: visit, room_id: drowned_plaza}
    - {type: visit, room_id: knights_hall}
    - {type: visit, room_id: coral_palace}
    - {type: kill, monster_id: coral_guardian, count: 2}
  reward: {xp: 1200, gold: 150, items: [{item_id: kelp_salve, quantity: 3}]}
  min_level: 12

- id: walk_the_dark
  name: "Durch die Dunkelheit"
  giver_id: faceless_merchant
  description: "Du willst wissen, was hinter der Brücke ist? Dann geh. Über den Riss, über die Brücke, bis in die Halle der Stille. Zwei Wächter dort, und du hast gesehen, was ich gesehen habe."
  completion_text: "Jetzt weißt du es. Hinter der Stille wartet nur noch einer. Du bist bereit – oder du bist es nie."
  steps:
    - {type: visit, room_id: shadow_rift}
    - {type: visit, room_id: void_bridge}
    - {type: visit, room_id: silent_hall}
    - {type: kill, monster_id: shadow_warden, count: 2}
  reward: {xp: 1800, gold: 250, items: [{item_id: starlight_tonic}]}
  min_level: 14

# --- Hügelgräber: die Wolfskönig-Kette (Waffenmeisterin Brunhild, Schwester Liora) ---

- id: barrow_unrest
  name: "Unruhe in den Hügeln"
  giver_id: dwarf_armorer
  description: "Östlich des Anstiegs stehen die Toten aus ihren Hügeln auf. Meine Späher kommen nicht mehr durch. Schlag sechs dieser Grabwichte nieder, dann reden wir weiter."
  completion_text: "Sechs? Gut. Aber die Späher sagen, sie kämen alle aus dem Großen Hügel. Da unten liegt etwas, das sie ruft."
  objective: {type: kill, monster_id: barrow_wight, count: 6}
  reward: {xp: 800, gold: 60}
  min_level: 8

- id: dust_of_the_dead
  name: "Staub der Toten"
  giver_id: priestess
  description: "Wenn die Toten in den Hügeln wandeln, brauchen sie Ruhe, nicht nur Klingen. Bring mir fünf Hände Grabstaub, damit ich sie segnen kann."
  completion_text: "Der Staub wird still unter meinen Händen. Möge das Licht auch die finden, die du noch nicht erschlagen hast."
  objective: {type: deliver, item_id: wight_dust, quantity: 5}
  reward: {xp: 500, gold: 40, items: [{item_id: holy_water, quantity: 3}]}
  min_level: 8
  requires: [barrow_unrest]

- id: the_wolf_king
  name: "Der Wolfskönig"
  giver_id: dwarf_armorer
  description: "Gerulf. Die alten Lieder nennen ihn den Wolfskönig. Wenn er wieder auf seinem Thron sitzt, hören die Hügel nie auf. Geh hinunter und sorg dafür, dass er liegen bleibt."
  completion_text: "Sein Fang? Behalt ihn – oder bring ihn mir, und ich schmiede dir etwas, das seiner würdig ist."
  steps:
    - {type: visit, room_id: wolf_king_tomb}
    - {type: kill, monster_id: wolf_king, count: 1}
  reward: {xp: 1500, gold: 150, items: [{item_id: elixir}]}
  min_level: 9
  requires: [barrow_unrest]

# --- Kopfgelder: wiederholbare Jagdaufträge, je Region einer ---

- id: bounty_rats
  name: "Kopfgeld: Feldratten"
  giver_id: captain
  description: "Die Ratten am Feldweg fressen uns die Vorräte weg. Zehn Stück, und die Stadtkasse zahlt."
  completion_text: "Zehn weniger. Es werden wieder mehr – komm dann wieder."
  objective: {type: kill, monster_id: field_rat, count: 10}
  reward: {xp: 40, gold: 10}
  min_level: 1
  repeatable: true

- id: bounty_wolves
  name: "Kopfgeld: Hungrige Wölfe"
  giver_id: captain
  description: "Die Wölfe im Wald werden dreister. Acht Pelze weniger, und die Händler reisen wieder ruhiger."
  completion_text: "Gut gemacht. Das Rudel wird sich neu sammeln – wir zahlen auch beim nächsten Mal."
  objective: {type: kill, monster_id: wolf, count: 8}
  reward: {xp: 100, gold: 20}
  min_level: 2
  repeatable: true

- id: bounty_skeletons
  name: "Kopfgeld: Skelettwächter"
  giver_id: captain
  description: "In den Ruinen stehen die Toten wieder Wache. Schick acht von ihnen zurück in den Staub."
  completion_text: "Staub zu Staub. Bis die Ruinen sie wieder ausspucken."
  objective: {type: kill, monster_id: skeleton, count: 8}
  reward: {xp: 320, gold: 50}
  min_level: 4
  repeatable: true

- id: bounty_sailors
  name: "Kopfgeld: Ertrunkene Seeleute"
  giver_id: fisherwoman
  description: "Aus den Gezeitenhöhlen kriechen die Ertrunkenen. Acht, dann können meine Leute wieder Muscheln sammeln."
  completion_text: "Das Meer gibt sie zurück, und du schickst sie wieder hinein. Danke."
  objective: {type: kill, monster_id: drowned_sailor, count: 8}
  reward: {xp: 380, gold: 45}
  min_level: 5
  repeatable: true

- id: bounty_golems
  name: "Kopfgeld: Eisgolems"
  giver_id: dwarf_armorer
  description: "Die Golems am Gletscherhang blockieren den Erzweg. Sechs zerschlagen, und die Schmiede zahlt."
  completion_text: "Das Eis knackt, der Weg ist frei. Bis zum nächsten Frost."
  objective: {type: kill, monster_id: ice_golem, count: 6}
  reward: {xp: 690, gold: 65}
  min_level: 8
  repeatable: true

- id: bounty_dryads
  name: "Kopfgeld: Verdorbene Dryaden"
  giver_id: elf_ranger
  description: "Die Lichtung im Mondschein wird von verdorbenen Dryaden heimgesucht. Erlöse sechs von ihnen."
  completion_text: "Der Hain atmet auf. Doch die Fäulnis wächst nach."
  objective: {type: kill, monster_id: dryad, count: 6}
  reward: {xp: 900, gold: 65}
  min_level: 9
  repeatable: true

- id: bounty_salamanders
  name: "Kopfgeld: Feuersalamander"
  giver_id: crater_scout
  description: "Auf den Basaltstufen wimmelt es von Salamandern. Acht, und das Lager kann wieder schlafen."
  completion_text: "Asche und Schuppen. Komm wieder, wenn der Krater neue ausbrütet."
  objective: {type: kill, monster_id: fire_salamander, count: 8}
  reward: {xp: 1120, gold: 70}
  min_level: 11
  repeatable: true

- id: bounty_knights
  name: "Kopfgeld: Ertrunkene Ritter"
  giver_id: old_diver
  description: "Die Ritter in der Halle halten ihren Schwur noch im Tod. Sechs, dann kann ich weitertauchen."
  completion_text: "Ihr Schwur ist gebrochen – für eine Weile."
  objective: {type: kill, monster_id: drowned_knight, count: 6}
  reward: {xp: 1170, gold: 100}
  min_level: 12
  repeatable: true

- id: bounty_stalkers
  name: "Kopfgeld: Schattenpirscher"
  giver_id: faceless_merchant
  description: "Pirscher im Riss. Acht. Die Zuflucht zahlt."
  completion_text: "Acht. Gut. Es gibt immer mehr."
  objective: {type: kill, monster_id: shadow_stalker, count: 8}
  reward: {xp: 2400, gold: 145}
  min_level: 14
  repeatable: true
