# Skills: active abilities of a class, from a level on. Used in a fight (or, healing only, also
# outside one) instead of an attack; the monster strikes back afterwards unless it is stunned.
#   damage    multiple of a normal hit (0: no hit), rounded half up, at least combat.min_damage
#   hits      how often it strikes (each hit rolled on its own)
#   pierce    ignores the monster's defense
#   stun      the monster does not strike back this round
#   heal      heals this percentage of the max HP
#   drain     heals this percentage of the damage dealt
#   group     heal and drain also reach every group member in the room
#   taunt     the next this many strikes at group members in the same fight hit the user
#   cooldown  combat rounds until it is ready again; every fight starts with all skills ready

# --- Abenteurer ----------------------------------------------------------------------------
- id: second_wind
  name: Zweiter Atem
  class_id: adventurer
  level: 1
  cooldown: 5
  heal: 20
  description: "Einmal tief durchatmen und weiter: heilt ein Fünftel deiner HP."
- id: power_strike
  name: Wuchthieb
  class_id: adventurer
  level: 6
  cooldown: 3
  damage: 1.5
  description: "Ein Schlag mit allem, was du hast: anderthalbfacher Schaden."

# --- Krieger -------------------------------------------------------------------------------
- id: shield_bash
