# Ausrüstungssets (ARCHITECTURE.md, "Sets"): je getragenem Teil zählt das Set hoch, Boni
# addieren sich ab der jeweiligen Teilezahl. Ein Teil gehört höchstens zu einem Set.

- id: leather
  name: "Jägerleder"
  items: [leather_cap, leather_armor, leather_leggings, leather_boots]
  bonuses:
    - {pieces: 2, effects: [{stat: max_hp, amount: 4}]}
    - {pieces: 4, effects: [{stat: defense, amount: 1}, {stat: max_hp, amount: 4}]}

