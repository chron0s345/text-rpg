# --- Fundstücke: die Geschichte des Risses (ansehen: Klick auf den Namen) ---

- id: wanted_poster
  name: "Steckbrief vom Brunnen"
  description: "GESUCHT – wer die Gruft unter dem Alten Friedhof betritt und den Siegelring der Valen zurückbringt. Der Stadtrat zahlt gut. Darunter, mit Kohle gekritzelt: »Der Ring ist nicht das Problem. Das Grüne Licht ist es.«"
  kind: misc
  icon: "scroll"
  value: 2
  sellable: true
  stackable: false

- id: goblin_letter
  name: "Zerknitterter Goblinbrief"
  description: "In krakeliger Schrift: »Groß-Boss sagt, Wald nicht mehr gut. Tote laufen im Moor. Grünes Licht auf dem Turm am Meer, und wer hinschaut, geht ins Wasser. Wir gehen nach Osten in die Felder. Ratten essen ist besser als tot sein.«"
  kind: misc
  icon: "scroll"
  value: 2
  sellable: true
  stackable: false

- id: child_drawing
  name: "Kinderzeichnung"
  description: "Mit Kreide gemalt: ein Turm am Meer, oben eine Frau mit grünen Haaren, die singt. Darunter in Kinderschrift: »Mama sagt, wer das Lied hört, kommt nicht zurück. Papa ist zum Fischen gefahren.«"
  kind: misc
  icon: "scroll"
  value: 2
  sellable: true
  stackable: false

- id: valen_testament
  name: "Valens Testament"
  description: "»Ich, Aldric Valen, habe die Tür geöffnet, die mein Großvater versiegelte. Die Stimme unter der Mine versprach mir ewiges Leben. Wer dies liest: Sie hat ihr Versprechen gehalten. Auf ihre Weise. Grabt nicht tiefer.«"
  kind: misc
  icon: "scroll"
  value: 2
  sellable: true
  stackable: false

- id: miner_diary
  name: "Tagebuchseite eines Bergmanns"
  description: "»Tag 41. Wir haben zu tief gegraben. Unter dem dritten Stollen ist ein Riss, kalt wie der Winter und still wie ein Grab. Seitdem kommen die Spinnen. Seitdem flüstert es nachts. Morgen verbarrikadieren wir die Wache.«"
  kind: misc
  icon: "scroll"
  value: 2
  sellable: true
  stackable: false

- id: ship_log
  name: "Logbuch der »Möwe«"
  description: "Die letzten Einträge, verwischt vom Salzwasser: »Grünes Licht am Leuchtturm, wo seit Jahren kein Wärter mehr lebt. Der Kapitän hält Kurs darauf. Wir alle hören den Gesang. Niemand dreht das Ruder.«"
  kind: misc
  icon: "scroll"
  value: 2
  sellable: true
  stackable: false

- id: smuggler_note
  name: "Notiz eines Schmugglers"
  description: "»Lieferung für den Kunden ohne Gesicht: drei Kisten Sternenstahl, bezahlt mit Gold, das kalt ist. Treffpunkt wie immer unter der Mine. Frag nicht, wie er da unten lebt. Frag nicht, was er mit dem Stahl macht.«"
  kind: misc
  icon: "scroll"
  value: 2
  sellable: true
  stackable: false

- id: dwarf_chronicle
  name: "Chronik von Khazdur"
  description: "»Im Jahr des Langen Winters verschlossen die Alten den Riss mit Feuer und Eis. Hrimfang wacht im Norden, Ignaros im Herzen des Bergs. Solange ihre Kräfte im Gleichgewicht sind, bleibt die Tür zu. Möge niemand je beide erschlagen.«"
  kind: misc
  icon: "scroll"
  value: 2
  sellable: true
  stackable: false

- id: ilva_map
  name: "Ilvas Kartenskizze"
  description: "Eine hastig gezeichnete Karte des Kraters, Lavaströme rot schraffiert. Am Rand steht: »Der Glutfürst schläft nicht. Er wacht. Und was er bewacht, liegt nicht hier, sondern unter uns allen.«"
  kind: misc
  icon: "scroll"
  value: 2
  sellable: true
  stackable: false

- id: lantern_prayer
  name: "Gebet an die Laternen"
  description: "»Licht, das nicht wankt. Licht, das nicht frisst. Halte die Nacht vor diesem Kreis. – Wer dies liest, ist weiter gekommen als wir. Lass eine Laterne brennen, wenn du gehst.«"
  kind: misc
  icon: "scroll"
  value: 2
  sellable: true
  stackable: false

- id: black_tablet
  name: "Schwarze Tafel"
  description: "Eine Steintafel, deren Schrift sich beim Lesen bewegt: »Ich war ein König, bevor es Sterne gab. Sie haben mich unter die Welt gesperrt, mit Feuer und mit Eis. Doch Türen öffnen sich immer von innen. Ihr habt mich nur besiegt. Nicht verschlossen.«"
  kind: misc
  icon: "scroll"
  value: 2
  sellable: true
  stackable: false

