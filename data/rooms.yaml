- id: town_square
  name: "Marktplatz von Oakhaven"
  description: "Ein lebhafter Platz im Herzen der Stadt. Ein plätschernder Brunnen spendet frisches Wasser."
  safe: true
  checkpoint: true
  bank: false
  exits:
    north: town_bank
    east: town_market
    south: forest_gate
    west: town_smithy
  spawns: []
  items: []

- id: town_bank
  name: "Bank von Oakhaven"
  description: "Ein stabiles Steingebäude mit schwer beschlagenen Eichentüren. Hier werden Wertsachen sicher verwahrt."
  safe: true
  checkpoint: false
  bank: true
  exits:
    south: town_square
  spawns: []
  items: []

- id: town_market
  name: "Kaufmannsstand"
  description: "Verschiedene Waren liegen auf Holztischen aus. Ein Händler preist lautstark seine Vorräte an."
  safe: true
  checkpoint: false
  bank: false
  exits:
    west: town_square
  spawns: []
  items: []

- id: forest_gate
  name: "Südtor zum Wald"
  description: "Die hölzernen Stadtpalisaden enden hier. Vor dir erstreckt sich die dichte Wildnis."
  safe: false
  checkpoint: false
  bank: false
  exits:
    north: town_square
    south: dark_forest
  spawns: []
  items: []

- id: dark_forest
  name: "Dunkler Wald"
  description: "Dichte Baumkronen schlucken das Sonnenlicht. Du hörst Rascheln im Unterholz."
  safe: false
  checkpoint: false
  bank: false
  exits:
    north: forest_gate
    east: goblin_camp
    south: bog_path
  spawns:
    - monster_id: goblin
      count: 1
    - monster_id: wolf
      count: 1
  items: []

- id: goblin_camp
  name: "Goblin-Lager"
  description: "Knorrige Hütten aus Ästen und Dreck umgeben eine erloschene Feuerstelle."
  safe: false
  checkpoint: false
  bank: false
  exits:
    west: dark_forest
  spawns:
    - monster_id: goblin
      count: 2
    - monster_id: goblin_warrior
      count: 1
  items:
    - item_id: bread
      quantity: 2
      respawn_seconds: 120

- id: town_smithy
  name: "Schmiede"
  description: "Hitze schlägt dir aus der Esse entgegen. An den Wänden hängen Klingen, Helme und Kettenhemden."
  safe: true
  checkpoint: false
  bank: false
  exits:
    east: town_square
  spawns: []
  items: []

- id: bog_path
  name: "Moorpfad"
  description: "Morsche Bohlen führen über schwarzes Wasser. Nebel kriecht zwischen den Schilfhalmen, und irgendwo blubbert es."
  safe: false
  checkpoint: false
  bank: false
  exits:
    north: dark_forest
    east: bog_camp
    south: ruins_gate
  spawns:
    - monster_id: bog_lurker
      count: 1
    - monster_id: wolf
      count: 1
  items:
    - item_id: bog_herb
      quantity: 2
      respawn_seconds: 180

- id: bog_camp
  name: "Lagerfeuer am Moor"
  description: "Auf einer trockenen Anhöhe glimmt ein Feuer, das nie ganz erlischt. Wanderer rasten hier, bevor sie weiterziehen."
  safe: true
  checkpoint: true
  bank: false
  exits:
    west: bog_path
    east: mountain_trail
  spawns: []
  items: []

- id: ruins_gate
  name: "Eingestürztes Tor"
  description: "Zwei halb zerfallene Türme rahmen einen Durchgang aus bemoostem Stein. Zwischen den Trümmern klappert etwas."
  safe: false
  checkpoint: false
  bank: false
  exits:
    north: bog_path
    south: ruins_hall
  spawns:
    - monster_id: skeleton
      count: 1
  items: []

- id: ruins_hall
  name: "Halle der Ruine"
  description: "Eine weite Halle unter eingestürzter Kuppel. In der Mitte führt eine Treppe hinab in die Dunkelheit."
  safe: false
  checkpoint: false
  bank: false
  exits:
    north: ruins_gate
    down: old_mine
  spawns:
    - monster_id: skeleton
      count: 2
  items: []

- id: old_mine
  name: "Alte Mine"
  description: "Verrostete Schienen verlieren sich in feuchten Stollen. Es riecht nach Erde – und nach etwas sehr Großem."
  safe: false
  checkpoint: false
  bank: false
  exits:
    up: ruins_hall
    down: mine_watch
  spawns:
    - monster_id: cave_troll
      count: 1
  items: []

# --- Grauzahn-Gebirge (Stufe 6–10), östlich des Lagerfeuers ---

- id: mountain_trail
  name: "Steiler Anstieg"
  description: "Ein schmaler Pfad windet sich zwischen Felsblöcken nach oben. Über dir kreisen Schatten mit ledrigen Schwingen."
  safe: false
  checkpoint: false
  bank: false
  exits:
    west: bog_camp
    north: dwarf_outpost
  spawns:
    - monster_id: mountain_harpy
      count: 2
  items: []

- id: dwarf_outpost
  name: "Zwergenposten Khazdur"
  description: "Eine in den Fels gehauene Feste mit glühenden Kohlebecken. Zwerge in schweren Rüstungen nicken dir knapp zu."
  safe: true
  checkpoint: true
  bank: true
  exits:
    south: mountain_trail
    east: frost_gorge
  spawns: []
  items: []

- id: frost_gorge
  name: "Frostklamm"
  description: "Eisige Winde heulen durch die enge Schlucht. Zwischen vereisten Felsen leuchten rote Beeren."
  safe: false
  checkpoint: false
  bank: false
  exits:
    west: dwarf_outpost
    up: glacier_slope
  spawns:
    - monster_id: frost_wolf
      count: 2
  items:
    - item_id: frost_berries
      quantity: 3
      respawn_seconds: 240

- id: glacier_slope
  name: "Gletscherhang"
  description: "Blankes Eis, so weit das Auge reicht. Manche der Eisblöcke stehen auffällig aufrecht – und bewegen sich."
  safe: false
  checkpoint: false
  bank: false
  exits:
    down: frost_gorge
    north: drake_lair
  spawns:
    - monster_id: ice_golem
      count: 2
  items: []

- id: drake_lair
  name: "Hort des Eisdrachen"
  description: "Eine gewaltige Eishöhle, übersät mit Knochen und gefrorenem Gold. Aus der Tiefe dringt ein kalter, langsamer Atem."
  safe: false
  checkpoint: false
  bank: false
  exits:
    south: glacier_slope
  spawns:
    - monster_id: ice_drake
      count: 1
  items: []

# --- Die Tiefen (Stufe 6–9), unter der Alten Mine ---

- id: mine_watch
  name: "Verlassene Grubenwache"
  description: "Eine verbarrikadierte Kammer mit Pritschen und einer erloschenen Laterne. Hier ist man vor dem, was in den Stollen haust, sicher."
  safe: true
  checkpoint: true
  bank: false
  exits:
    up: old_mine
    east: deep_tunnels
  spawns: []
  items: []

- id: deep_tunnels
  name: "Tiefe Stollen"
  description: "Die Stützbalken sind zersplittert, der Boden klebrig. Irgendwo schabt etwas mit langen Krallen über Stein."
  safe: false
  checkpoint: false
  bank: false
  exits:
    west: mine_watch
    east: spider_grotto
  spawns:
    - monster_id: mine_ghoul
      count: 2
  items: []

- id: spider_grotto
  name: "Spinnengrotte"
  description: "Dicke Seidenstränge spannen sich von Wand zu Wand. In den Netzen hängen eingesponnene Bündel, manche zucken noch."
  safe: false
  checkpoint: false
  bank: false
  exits:
    west: deep_tunnels
    down: spider_nest
  spawns:
    - monster_id: cave_spider
      count: 3
  items: []

- id: spider_nest
  name: "Nest der Spinnenkönigin"
  description: "Eine Kuppel aus Seide und Knochen. In ihrer Mitte thront ein Leib so groß wie ein Fuhrwerk, umgeben von glänzenden Augen."
  safe: false
  checkpoint: false
  bank: false
  exits:
    up: spider_grotto
  spawns:
    - monster_id: spider_queen
      count: 1
  items: []
