{% set p = view.player %}
<section id="shop" class="panel shop" aria-label="Händler"{% if not view.shops %} hidden{% endif %}{% if oob %} hx-swap-oob="true"{% endif %}>
  {% for shop in view.shops %}
  <h2>{{ shop.name }}</h2>
  <p class="description">„{{ shop.greeting }}“</p>
  <ul class="list">
    {% for o in shop.offers %}
    <li title="{{ o.description }}" class="{% if not o.affordable %}unaffordable{% endif %}">
      <span>{% if o.icon %}<img src="/static/icons/{{ o.icon }}.svg" alt="" class="icon">{% endif %}{{ o.name }} <span class="muted">{{ o.price }} Gold</span>{% if o.summary %}<small class="item-summary">{{ o.summary }}</small>{% endif %}</span>
      <button hx-post="/ui/actions" hx-vals='{{ {"type": "buy", "merchant_id": shop.merchant_id, "item_id": o.item_id, "quantity": "1"} | tojson }}'
              {% if not o.affordable or p.state != 'exploring' %}disabled{% endif %}
              {% if not o.affordable %}title="Zu wenig Gold"{% endif %}>Kaufen</button>
    </li>
    {% endfor %}
  </ul>
  {% endfor %}
</section>
