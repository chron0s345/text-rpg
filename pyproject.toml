[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# generated Alembic migrations keep long SQL expressions on one line
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["venv", ".venv"]

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs database code in greenlets: without this, coverage misses
# those lines and reports most service code as untested (pytest --cov=app)
concurrency = ["greenlet", "thread"]
source = ["app"]
