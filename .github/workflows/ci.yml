name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # only superseded PR runs are cancelled; every commit on main keeps its result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the minimum (pyproject), 3.14 is the local development version
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # Database tests start PostgreSQL via Testcontainers (Docker is available on the runner).
      # They skip themselves without Docker, so fail here if any test was skipped
      # (expected failures, pytest.xfail, are reported as skipped in JUnit and are allowed).
      - run: pytest tests/ -v -rs --junitxml=report.xml
      - name: Fail on skipped tests
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          skipped = [
              case.get("name")
              for case in ET.parse("report.xml").iter("testcase")
              for skip in case.findall("skipped")
              if skip.get("type") != "pytest.xfail"
          ]
          if skipped:
              sys.exit(f"{len(skipped)} test(s) were skipped in CI: {skipped}")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python-version }}
          path: report.xml

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # the image must build and come up healthy (migrations, seed, server) against PostgreSQL
      - run: docker build -t text-rpg:ci .
      - run: docker network create rpg
      - run: >
          docker run -d --name db --network rpg
          -e POSTGRES_USER=rpg -e POSTGRES_PASSWORD=rpg -e POSTGRES_DB=rpg
          --health-cmd "pg_isready -U rpg -d rpg" --health-interval 2s
          postgres:16-alpine
      - name: Wait for the database
        run: |
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' db)" = healthy ] && exit 0
            sleep 2
          done
          exit 1
      - run: >
          docker run -d --name app --network rpg -p 8000:8000
          -e DATABASE_URL=postgresql+asyncpg://rpg:rpg@db:5432/rpg
          -e SESSION_SECRET=ci-secret -e WEB_CONCURRENCY=2
          text-rpg:ci
      - name: Wait for the app
        run: |
          for i in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && exit 0
            sleep 2
          done
          docker logs app
          exit 1
      - run: curl --fail --silent http://127.0.0.1:8000/welcome > /dev/null
      - if: failure()
        run: docker logs app || true
